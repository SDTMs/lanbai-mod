name: Save Nitter HTML
on:
  workflow_dispatch:
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p /tmp/out
          curl -s --max-time 30 "https://nitter.tiekoetter.com/youyume0225" -o /tmp/out/page.html
          wc -c /tmp/out/page.html
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nitter-html
          path: /tmp/out/page.html
