name: Twitter Reachability Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Twitter endpoints
        run: |
          echo "=== x.com ==="
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 15 https://x.com || echo "fail"
          echo "=== api.twitter.com ==="
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 15 https://api.twitter.com || echo "fail"
          echo "=== api.fxtwitter.com ==="
          curl -s --max-time 15 https://api.fxtwitter.com/youyume0225 | head -c 200
          echo ""
          echo "=== nitter.net ==="
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 15 https://nitter.net || echo "fail"
