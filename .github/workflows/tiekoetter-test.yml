name: Tiekoetter Content Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          echo "=== RSS ==="
          curl -s --max-time 25 "https://nitter.tiekoetter.com/youyume0225/rss" | head -c 2000
          echo ""
          echo "=== HTML items ==="
          curl -s --max-time 25 "https://nitter.tiekoetter.com/youyume0225" | grep -c "timeline-item" || echo 0
